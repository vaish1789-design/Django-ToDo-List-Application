services:
  - type: web
    name: django-todo-resume
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn taskmanager.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: django-todo-db
          property: connectionString

databases:
  - name: django-todo-db
    databaseName: tododb
    user: todouser
