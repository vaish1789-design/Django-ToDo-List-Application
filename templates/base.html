<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TaskFlow{% endblock %} | TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'task_list' %}">✓ TaskFlow</a>
    <div class="d-flex align-items-center gap-3">
      {% if user.is_authenticated %}
        <span class="text-white-50 small d-none d-sm-inline">Hi, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
        </form>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
        <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4 py-md-5">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="container text-center text-secondary small py-4">Built with Python & Django · TaskFlow</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
